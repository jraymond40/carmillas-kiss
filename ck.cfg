###############################################################################
# FluffOS configuration file - generated by `driver --generate-config`.
#
# Integer options are shown at their compiled-in defaults. Required values
# with no sensible default (the MUD name, the mudlib path) use placeholders
# you must edit. Options that need external resources (websocket, TLS,
# external commands) are commented out -- uncomment and edit to enable them.
###############################################################################

# ----- Identity & Network -----

# Name of this MUD. (required)
name : ck

# IP address to bind to; useful on hosts with multiple network addresses.
# (optional)
# mud ip : 127.0.0.1

# ----- Ports & Connections -----

# Plain telnet listener.
external_port_1 : telnet 4000

# Optional extra listeners -- uncomment and edit to enable:
# external_port_2 : binary 4001
# external_port_3 : websocket 8080
# websocket http dir : www                # a websocket port requires this
# external_port_3_tls : cert=etc/cert.pem key=etc/key.pem

# ----- Directory Structure -----

# Absolute path to the mudlib root (this path is not relative to the mudlib).
# (required)
mudlib directory : lib

# Filesystem directory for debug.log and stats files, resolved relative to the
# driver's working directory (leading slashes are stripped); not a mudlib
# virtual path. (required)
log directory : system/log

# Colon-separated list of directories searched by `#include <...>`. (required)
include directories : includes:lib/includes

# ----- Core Files -----

# Path to the object that defines the master object. (required)
#master file : /single/master
master file : system/system.lpc

# Path to the object that defines global simulated efuns. (optional)
# simulated efun file : /single/simul_efun

# ----- Logging -----

# Filename (within the log directory) for the driver's debug log.
# (recommended)
debug log file : debug.log

# ----- Error Handling -----

# Message shown to players when error() occurs. (optional)
default error message : Oops, something went wrong. Please report this to the admin. 

# Pass runtime errors to the master object's error_handler() instead of
# handling them in the driver.
mudlib error handler : 0

# Call crash() in the master object and shut down cleanly on signals that
# would otherwise crash the driver.
trap crashes : 1

# ----- Timing & Lifecycle -----

# Seconds an object may be idle before clean_up() is called on it; should be
# well above 'time to swap'.
time to clean up : 1800

# Seconds between successive reset() calls on an object.
time to reset : 900

# Seconds an unused object stays in memory before being swapped out; 0
# disables swapping.
time to swap : 300

# Granularity of in-game time in milliseconds (the shortest visible time
# interval).
gametick msec : 1000

# Heartbeat interval in milliseconds.
heartbeat interval msec : 1000

# How long one turn of the promise microtask drain may hold the event loop, in
# the same microseconds `maximum evaluation cost` is measured in (FluffOS
# meters eval cost with a wall-clock timer, so the two units are the same
# thing). When the turn has spent this much, the remaining deliveries are
# deferred past the next I/O poll -- the loop reads sockets, schedules
# commands and fires timers, then the drain resumes. Deferral is not an error
# and nothing is dropped, and a delivery already in flight is never
# interrupted: the budget governs how many deliveries a turn STARTS, and each
# one is armed with a whole `maximum evaluation cost` of its own so it runs to
# its natural end no matter what the turn spent before it. A turn also ends
# immediately when the delivery that just ran consumed its entire budget --
# that handler has already held the loop longer than any turn budget. This
# replaced a count of deliveries, which could not bound anything: each
# delivery is armed with a fresh `maximum evaluation cost`, so a batch of N
# had a worst case of N times that -- measured at 17-21 SECOND freezes with
# the old default of 512. A budget bounds the turn at itself plus at most one
# delivery's eval cost, which is the same worst case any ordinary command or
# call_out already has. 0 (the default) uses a built-in budget of one
# millisecond.
async drain eval budget : 0

# Ceiling on promise reactions waiting to be delivered. Attaching another one
# past this point is an LPC error, which is what stops a self-feeding chain --
# a handler that attaches more reactions than the drain retires -- from
# growing the queue until the driver runs out of memory and aborts. This is
# the promise-side analogue of `call_out(0) nest level`, which refuses the
# same runaway shape for same-tick call_outs. It also bounds promises handed
# out by `async_yield()` and still waiting for the event loop's next pass,
# which is the same shape: a pending yield stays allocated after the caller
# drops it, because the driver still holds it. The limit bounds QUEUED
# deliveries and pending yields, not parked async frames; those have their own
# ceiling in `max suspended async functions`. 0 disables the check, which lets
# a runaway chain abort the driver.
max pending promise deliveries : 100000

# ----- Limits -----

# Maximum size of the evaluator stack, which holds all local variables and
# call arguments.
evaluator stack size : 65536

# Maximum depth of an object's inheritance chain.
inherit chain size : 30

# Maximum eval cost a single thread may consume before execution is aborted.
maximum evaluation cost : 30000000

# Maximum nesting depth of LPC function calls.
maximum call depth : 150

# Maximum number of elements in a single array.
maximum array size : 15000

# Maximum size, in bytes, of a single buffer variable.
maximum buffer size : 1048576

# Maximum number of entries in a single mapping.
maximum mapping size : 150000

# Maximum length, in bytes, of a single string variable.
maximum string length : 1048576

# Maximum number of bits in a bitfield (stored 6 bits per printable byte).
maximum bits in a bitfield : 12000

# Maximum number of bytes a single read_bytes()/write_bytes() call may
# transfer.
maximum byte transfer : 262144

# Maximum size, in bytes, of a file that read_file() may read.
maximum read file size : 262144

# ----- Hash Tables -----

# Size of the shared-string hash table; should be prime, roughly 1/5 of the
# number of distinct strings.
hash table size : 65536

# Size of the object hash table; roughly 1/4 of the number of objects in the
# game.
object table size : 4096

# Size of the find_living() hash table; must be one of 4, 16, 64, 256, 1024,
# or 4096.
living hash table size : 256

# ----- Reset Behavior -----

# Completely disable the periodic calling of reset().
no resets : 0

# Only call reset() when an object is touched via call_other() or
# move_object().
lazy resets : 0

# Spread reset() calls over a randomized interval rather than firing them all
# at once.
randomized resets : 1

# ----- Language Behavior -----

# explode() strips at most one leading delimiter (and still one trailing
# delimiter).
sane explode string : 1

# Make implode(explode(x, y), y) always equal x; overrides 'sane explode
# string'.
reversible explode string : 0

# Use a well-defined, stable ordering for the driver's sorting operations.
sane sorting : 1

# Make this_player() usable from within call_out() callbacks, and from the
# callbacks of other deferred efuns (resolve(), async_read(), async_write(),
# async_getdir(), async_db_exec()).
this_player in call_out : 1

# Run deferred functions registered with defer() in reverse order.
reverse defer : 0

# Treat negative range indices in strings/buffers as counting from the end
# (rvalue use only).
old range behavior : 0

# Warn when code relies on 'old range behavior'.
warn old range behavior : 1

# Call init() in an object when enable_commands() is invoked on it.
enable_commands call init : 1

# Make sprintf() column justification ignore ANSI color codes when computing
# field width.
sprintf add_justified ignore ANSI colors : 1

# Maximum nesting level for chains of call_out(0) within a single backend
# cycle.
call_out(0) nest level : 1000

# Maximum number of concurrently suspended async function frames; an await
# that would exceed it errors instead of suspending (runaway-exhaustion
# guard). 0 disables the limit.
max suspended async functions : 10000

# ----- Type Checking -----

# Enable type checking for call_other() (the -> operator on objects).
call other type check : 0

# Emit warnings instead of errors for call_other() type mismatches.
call other warn : 0

# Reintroduce a legacy type-checking bug for backwards compatibility.
old type behavior : 0

# ----- Player I/O -----

# Replace ANSI escape characters (ASCII 27) in user input with a space before
# add_actions run.
no ansi : 1

# Strip ANSI before process_input() sees the input, rather than only before
# add_actions are called.
strip before process input : 1

# Call catch_tell() on interactive users as well as on NPCs.
interactive catch tell : 0

# Send snoop text to receive_snoop() in the snooper instead of directly via
# add_message().
receive snoop : 1

# Report snooped output even when the target's catch_tell() is shadowed
# (prefixed with $$).
snoop shadowed : 0

# Write tells/messages sent to non-interactive objects to stderr, prefixed
# with ']' (legacy behavior).
noninteractive stderr write : 0

# ----- Diagnostics -----

# Enable the trace() and traceprefix() efuns (leaving it off runs slightly
# faster).
trace : 1

# Include the preceding lines of LPC code in error traces (slower).
trace code : 0

# Allow the driver's interactive console via the -C command-line argument.
has console : 1

# Suppress unused-argument warnings, warning only about unused local
# variables.
suppress argument warnings : 1

# Record LPC execution context for tracing and debugging.
trace lpc execution context : 0

# Trace individual LPC instructions for debugging.
trace lpc instructions : 0

# Print each file name to the debug log while preload files are loaded at
# boot.
display preload progress : 1

# ----- Protocol Support -----

# Advertise and enable the MXP telnet protocol.
enable mxp : 0

# Advertise and enable the GMCP telnet protocol.
enable gmcp : 0

# Advertise and enable the ZMP telnet protocol.
enable zmp : 0

# Advertise and enable the MSSP telnet protocol.
enable mssp : 1

# Advertise and enable the MSP telnet protocol.
enable msp : 1

# Advertise and enable the MSDP telnet protocol.
enable msdp : 0

# ----- Other -----

# Header automatically #include'd in every compiled object (optional).
# global include file : "/include/globals.h"

# Message used when an action returns 0 and no notify_fail() was set.
default fail message : What?

# External programs callable via external_start() (requires PACKAGE_EXTERNAL).
# external_cmd_1 : /bin/cat

